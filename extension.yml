schema_version: "1.0"

extension:
  id: lifecycle
  name: "SDD Lifecycle Manager"
  version: "1.1.0"
  description: "Generic phase-gate for Spec Kit — block or allow commands per lifecycle phase. Any phase configurable, any plugin can trigger lock/unlock hooks."
  author: "Wagner Sousa"
  repository: "https://github.com/wagner-sousa/spec-kit-lifecycle"
  license: "MIT"
  homepage: "https://github.com/wagner-sousa/spec-kit-lifecycle"

requires:
  speckit_version: ">=0.4.0"

provides:
  commands:
    - name: speckit.lifecycle.check
      file: commands/speckit.lifecycle.check.md
      description: "Read current phase and block if commands are restricted by config"
    - name: speckit.lifecycle.lock
      file: commands/speckit.lifecycle.lock.md
      description: "Transition spec to configured locked phase — blocks commands per lifecycle-config.yml"
    - name: speckit.lifecycle.unlock
      file: commands/speckit.lifecycle.unlock.md
      description: "Transition spec back to active phase — re-enables commands (supports --spec-dir for cross-plugin use)"
    - name: speckit.lifecycle.status
      file: commands/speckit.lifecycle.status.md
      description: "Show current lifecycle phase, metadata, and per-phase command availability"
    - name: speckit.lifecycle.write-agents
      file: commands/speckit.lifecycle.write-agents.md
      description: "Write lifecycle phase and command restrictions into agent context file"

  config:
    - name: "lifecycle-config.yml"
      file: "lifecycle-config.yml"
      description: "Define phases and their blocked/allowed command patterns"
      required: false

  hooks:
    after_lifecycle_lock:
      command: speckit.lifecycle.write-agents
      optional: false
      description: "Generic post-lock hook — syncs phase restrictions to agent context. Triggered by any lock action, internal or external."
    after_lifecycle_unlock:
      command: speckit.lifecycle.write-agents
      optional: false
      description: "Generic post-unlock hook — removes phase restrictions from agent context. Triggered by any unlock action, internal or external."

tags:
  - "lifecycle"
  - "governance"
  - "gates"
  - "workflow"
  - "phases"
